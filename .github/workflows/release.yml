---
name: Release Multi-Arch Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive_name: meshbeacon_linux_amd64
          - goos: linux
            goarch: arm64
            archive_name: meshbeacon_linux_arm64
          - goos: linux
            goarch: arm
            goarm: '7'
            archive_name: meshbeacon_linux_armv7
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            archive_name: meshbeacon_linux_mipsle
          - goos: darwin
            goarch: amd64
            archive_name: meshbeacon_darwin_amd64
          - goos: darwin
            goarch: arm64
            archive_name: meshbeacon_darwin_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: 0
        run: |
          go build -v -ldflags="-s -w" -o meshbeacon ./cmd/meshbeacon
          tar -czf ${{ matrix.archive_name }}.tar.gz \
            meshbeacon meshbeacon.example.json LICENSE

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}.tar.gz
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum meshbeacon_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false

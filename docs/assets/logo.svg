<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="beaconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Signal Arcs -->
  <path d="M 42 22 A 16 16 0 0 0 42 38" stroke="url(#beaconGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 35 15 A 25 25 0 0 0 35 45" stroke="url(#beaconGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 28 8 A 34 34 0 0 0 28 52" stroke="url(#beaconGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Right Signal Arcs -->
  <path d="M 58 22 A 16 16 0 0 1 58 38" stroke="url(#beaconGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 65 15 A 25 25 0 0 1 65 45" stroke="url(#beaconGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 72 8 A 34 34 0 0 1 72 52" stroke="url(#beaconGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Tower Mast & Emitter Dot -->
  <circle cx="50" cy="30" r="4.5" fill="url(#beaconGrad)" filter="url(#beaconGlow)" />
  <line x1="50" y1="34" x2="50" y2="44" stroke="url(#beaconGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Lattice Tower Legs -->
  <polygon points="50,44 32,88 68,88" stroke="url(#beaconGrad)" stroke-width="3.5" stroke-linejoin="round" fill="none" />
  
  <!-- Lattice Cross Bracing -->
  <line x1="41" y1="64" x2="59" y2="64" stroke="url(#beaconGrad)" stroke-width="2.5" />
  <line x1="36" y1="76" x2="64" y2="76" stroke="url(#beaconGrad)" stroke-width="2.5" />
  <line x1="41" y1="64" x2="50" y2="76" stroke="url(#beaconGrad)" stroke-width="2" />
  <line x1="59" y1="64" x2="50" y2="76" stroke="url(#beaconGrad)" stroke-width="2" />
  <line x1="50" y1="44" x2="50" y2="88" stroke="url(#beaconGrad)" stroke-width="2" />
</svg>
